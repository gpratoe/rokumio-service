plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rokumio.host'
    compileSdk 34

    defaultConfig {
        applicationId "com.rokumio.host"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        // Dev builds (gradle -PdevMode=true) default the channel id to `dev`
        // and expose the channel-id override field in the Roku companion UI;
        // production builds lock it to the published app id (881630).
        buildConfigField "boolean", "DEV_MODE", "${project.findProperty('devMode') ?: false}"
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            // The bundled native executables (ffmpeg, ffprobe, node) are named
            // lib*.so so AGP packages them into lib/<abi>/ and — with legacy
            // packaging — extracts them to a real on-disk file with the exec bit
            // at install time. They are then spawned as child processes by the
            // server; they are NOT loaded as JNI/shared libraries, and executing
            // them requires them to be physically present with the exec bit set
            // (which only happens with legacy packaging).
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            // The standalone native executables (node, ffmpeg, ffprobe) are
            // staged at <repo>/native/bin/<abi>/ by the fetch/build scripts.
            // They are PIE executables, not linkable shared libs; ServerService
            // spawns them. Pointing the jniLibs source set at native/bin feeds
            // them through AGP's jniLibs packaging (see packagingOptions above).
            jniLibs.srcDirs "../native/bin"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'
}
