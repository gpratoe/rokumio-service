plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rokumio.host'
    compileSdk 34

    defaultConfig {
        applicationId "com.rokumio.host"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        // ffmpeg/ffprobe are built for arm64-v8a only
        // (scripts/build-ffmpeg-android.sh) and the standalone Node executable
        // (node-android/bin/arm64-v8a/libnode.so) is arm64 only too. Packaging
        // is therefore limited to arm64.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            // Extract native libs to a real on-disk file so their exec bit is
            // applied at install time. ffmpeg/ffprobe are shipped as standalone
            // .so-named jniLibs and spawned by the server; the standalone Node
            // executable ships the same way. Executing them requires them to be
            // physically present with the exec bit set, which only happens with
            // legacy packaging (jniLibs are otherwise read from the APK).
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            // Package the standalone Node 26 executable (per ABI) into the APK.
            // It lives at <repo>/node-android/bin/<abi>/libnode.so — a PIE
            // executable, not a linkable shared lib — staged by
            // scripts/fetch-node-android.sh. ServerService spawns it the same
            // way the server spawns ffmpeg/ffprobe.
            jniLibs.srcDirs "jniLibs", "../node-android/bin"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'
}
